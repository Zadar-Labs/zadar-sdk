[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zadar-udp-sdk"
version = "0.0.0"
description = "Shared Python SDK packages for Zadar UDP sensors"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "protobuf>=4.25,<6",
    "requests>=2.28",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
